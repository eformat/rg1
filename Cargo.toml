[package]
name = "rg1"
version = "0.1.0"
edition = "2021"
description = "grep, but the pattern is a description: ripgrep's engine finds candidates, a decision engine judges them"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
regex = "1"
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
futures = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
csv = "1"
unidiff = "0.4"
sha2 = "0.10"
tree-sitter = "0.25"
tree-sitter-python = "0.23"
tree-sitter-go = "0.23"
tree-sitter-c = "0.23"

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"

[[bin]]
name = "rg1"
path = "src/main.rs"

[profile.release]
strip = true
lto = "thin"
